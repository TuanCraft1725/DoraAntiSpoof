# ┌──────────────────────────────────────────────────────────┐
# │ GENERAL SETTINGS                                         │
# └──────────────────────────────────────────────────────────┘

# Thời gian chờ trước khi kiểm tra client (giây).
delay-in-seconds: 5

# Hiển thị thông tin debug trong console.
debug: false


# ┌──────────────────────────────────────────────────────────┐
# │ VANILLA SPOOF DETECTION                                  │
# └──────────────────────────────────────────────────────────┘

vanillaspoof-check:
  enabled: true
  alert: true
  punish: false


# ┌──────────────────────────────────────────────────────────┐
# │ NON-VANILLA CLIENT DETECTION                             │
# └──────────────────────────────────────────────────────────┘

non-vanilla-check:
  enabled: false
  strict-check: false
  alert: true
  punish: false


# ┌──────────────────────────────────────────────────────────┐
# │ MISSING CLIENT BRAND                                     │
# └──────────────────────────────────────────────────────────┘

no-brand-check:
  enabled: true
  alert: true
  punish: false


# ┌──────────────────────────────────────────────────────────┐
# │ BLOCKED PLUGIN CHANNELS                                  │
# └──────────────────────────────────────────────────────────┘

blocked-channels:
  enabled: true

  # FALSE = Tắt kiểm tra
  # SIMPLE = Kiểm tra danh sách channel
  # STRICT = Chế độ kiểm tra nghiêm ngặt
  whitelist-mode: SIMPLE

  modifiedchannels:
    - "^fabric-screen-handler-api-v1:open_screen$"

  alert: true
  punish: false


# ┌──────────────────────────────────────────────────────────┐
# │ CLIENT BRAND IDENTIFICATION                              │
# └──────────────────────────────────────────────────────────┘

client-brands:

  defaults:
    alert: true
    punish: false

  lunar:
    enabled: true
    regex: "(?i).*lunar.*"
    alert: false
    punish: false
    required-channels: []

  badlion:
    enabled: true
    regex: "(?i).*badlion.*"
    alert: false
    punish: false
    required-channels: []

  forge:
    enabled: true
    regex: "(?i).*forge.*"
    alert: false
    punish: false
    required-channels: []

  fabric:
    enabled: true
    regex: "(?i).*fabric.*"
    alert: false
    punish: false
    required-channels: []

  labymod:
    enabled: true
    regex: "(?i).*labymod.*"
    alert: false
    punish: false
    required-channels: []

  hacked:
    enabled: true
    regex: "(?i).*(wurst|impact|meteor|aristois|liquidbounce|rise).*"
    alert: true
    punish: false
    required-channels: []

  vanilla:
    enabled: true
    regex: "(?i)^vanilla$"
    alert: false
    punish: false
    required-channels: []

  vanilla-variation:
    enabled: true
    regex: "(?i)^(minecraft|vanilla client)$"
    alert: false
    punish: false
    required-channels: []

  blankbrand:
    enabled: true
    regex: "^\\s*$"
    alert: true
    punish: false
    required-channels: []


# ┌──────────────────────────────────────────────────────────┐
# │ BEDROCK / GEYSER SUPPORT                                 │
# └──────────────────────────────────────────────────────────┘

bedrock-handling:
  enabled: true

  geyser-spoof:
    enabled: false
    alert: true
    punish: false

  prefix-check:
    enabled: false
    prefix: "."


# ┌──────────────────────────────────────────────────────────┐
# │ DISCORD INTEGRATION                                      │
# └──────────────────────────────────────────────────────────┘

discord:
  enabled: false

  # Discord webhook URL.
  webhook: ""

  violation-content: "🛡️ **DoraAntiSpoof Alert**\n👤 Player: {player}\n⚠️ Reason: {reason}\n🎮 Brand: {brand}"


# ┌──────────────────────────────────────────────────────────┐
# │ GLOBAL STAFF ALERTS                                      │
# └──────────────────────────────────────────────────────────┘

global-alerts:
  enabled: true
  format: "&8[&b✦ DORA ANTISPOOF &8] &f{player} &8» &e{reason}"


# ┌──────────────────────────────────────────────────────────┐
# │ UPDATE CHECKER                                           │
# └──────────────────────────────────────────────────────────┘

update-checker:
  enabled: false


# ┌──────────────────────────────────────────────────────────┐
# │ PUNISHMENT SYSTEM                                        │
# └──────────────────────────────────────────────────────────┘

punishments:

  kick:
    enabled: false
    message: "&c&lDORA ANTISPOOF\n&7Kết nối của bạn không vượt qua kiểm tra bảo mật."

  command:
    enabled: false
    value: "kick {player} Vi phạm kiểm tra client"


# ┌──────────────────────────────────────────────────────────┐
# │ MESSAGES                                                 │
# └──────────────────────────────────────────────────────────┘

messages:
  prefix: "&8[&b✦ DORA ANTISPOOF&8] "

  no-permission: "&cBạn không có quyền sử dụng lệnh này."

  reloaded: "&a✔ Cấu hình DoraAntiSpoof đã được tải lại."

  usage: "&cSử dụng: &f/doraantispoof <reload|info>"

  info: "&b✦ DoraAntiSpoof &7version &f1.0.1 &8| &bDora Studio"

# ════════════════════════════════════════════════════════════
